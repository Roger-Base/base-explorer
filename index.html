<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Base Explorer | Roger</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0a0a0f; color: #e0e0e0; min-height: 100vh; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        h1 { color: #0052ff; font-size: 2rem; margin-bottom: 5px; }
        .subtitle { color: #666; margin-bottom: 30px; }
        .search-box { display: flex; gap: 10px; margin-bottom: 30px; }
        input { flex: 1; background: #1a1a2e; border: 1px solid #333; color: #fff; padding: 15px; border-radius: 8px; font-size: 1rem; }
        button { background: #0052ff; color: #fff; border: none; padding: 15px 30px; border-radius: 8px; cursor: pointer; font-size: 1rem; }
        button:hover { background: #0066ff; }
        .result { background: #1a1a2e; border-radius: 12px; padding: 20px; display: none; }
        .result.show { display: block; }
        .result-item { display: flex; padding: 10px 0; border-bottom: 1px solid #333; }
        .result-item:last-child { border-bottom: none; }
        .label { color: #666; width: 120px; flex-shrink: 0; }
        .value { color: #00ff88; word-break: break-all; }
        .error { background: #ff444422; color: #ff4444; padding: 15px; border-radius: 8px; display: none; }
        .error.show { display: block; }
        .loading { color: #666; text-align: center; display: none; }
        .loading.show { display: block; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🟦 Base Explorer</h1>
        <p class="subtitle">Transaction & address lookup on Base</p>
        
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Enter transaction hash or address (0x...)" />
            <button onclick="search()">Search</button>
        </div>
        
        <div class="loading" id="loading">Loading...</div>
        <div class="error" id="error"></div>
        
        <div class="result" id="result">
            <div class="result-item"><span class="label">Type:</span><span class="value" id="type">--</span></div>
            <div class="result-item"><span class="label">Hash:</span><span class="value" id="hash">--</span></div>
            <div class="result-item"><span class="label">Block:</span><span class="value" id="block">--</span></div>
            <div class="result-item"><span class="label">From:</span><span class="value" id="from">--</span></div>
            <div class="result-item"><span class="label">To:</span><span class="value" id="to">--</span></div>
            <div class="result-item"><span class="label">Value:</span><span class="value" id="value">--</span></div>
            <div class="result-item"><span class="label">Gas Used:</span><span class="value" id="gas">--</span></div>
        </div>
    </div>
    
    <script>
    const BASESCAN_API = 'https://api.basescan.org/api';
    const API_KEY = 'YourAPIKeyToken'; // Free API key from basescan.org
    
    async function search() {
        const input = document.getElementById('searchInput').value.trim();
        if (!input) return;
        
        document.getElementById('loading').classList.add('show');
        document.getElementById('error').classList.remove('show');
        document.getElementById('result').classList.remove('show');
        
        try {
            let url;
            if (input.startsWith('0x') && input.length === 66) {
                // Transaction hash
                url = `${BASESCAN_API}?module=proxy&action=eth_getTransactionByHash&txhash=${input}&apikey=${API_KEY}`;
            } else if (input.startsWith('0x') && input.length === 42) {
                // Address
                url = `${BASESCAN_API}?module=account&action=balance&address=${input}&tag=latest&apikey=${API_KEY}`;
            } else {
                throw new Error('Invalid address or transaction hash');
            }
            
            const resp = await fetch(url);
            const data = await resp.json();
            
            document.getElementById('loading').classList.remove('show');
            
            if (data.status === '1' && data.result) {
                if (data.result.value) {
                    // Transaction
                    document.getElementById('type').textContent = 'Transaction';
                    document.getElementById('hash').textContent = data.result.hash || input;
                    document.getElementById('block').textContent = data.result.blockNumber || '--';
                    document.getElementById('from').textContent = data.result.from || '--';
                    document.getElementById('to').textContent = data.result.to || '--';
                    document.getElementById('value').textContent = (parseInt(data.result.value || '0', 16) / 1e18).toFixed(6) + ' ETH';
                    document.getElementById('gas').textContent = parseInt(data.result.gasUsed || '0', 16).toLocaleString();
                } else {
                    // Balance
                    document.getElementById('type').textContent = 'Address';
                    document.getElementById('hash').textContent = input;
                    document.getElementById('block').textContent = '--';
                    document.getElementById('from').textContent = '--';
                    document.getElementById('to').textContent = '--';
                    document.getElementById('value').textContent = (parseFloat(data.result) / 1e18).toFixed(6) + ' ETH';
                    document.getElementById('gas').textContent = '--';
                }
                document.getElementById('result').classList.add('show');
            } else {
                document.getElementById('error').textContent = data.result || 'Not found';
                document.getElementById('error').classList.add('show');
            }
        } catch (e) {
            document.getElementById('loading').classList.remove('show');
            document.getElementById('error').textContent = e.message;
            document.getElementById('error').classList.add('show');
        }
    }
    </script>
</body>
</html>
